Gadget: TTRS Camera properties
Type:   Separator
Gadget:
Type:   Separator

Gadget: TTRS OCAM Info
Tip:    TTRS display information about the observer camera while it's active
Type:   Toggle
Var:    ocam_iShowInfo

String: TTRS Disable everything
Value:  -1
String: TTRS Hide info
Value:  0
String: TTRS Show info
Value:  1
String: TTRS Show info with commands
Value:  2

Gadget: TTRS OCAM Demo speed control
Tip:    TTRS allow observer camera to control demo speed during playback
Type:   Toggle
Var:    ocam_bPlaybackSpeedControl

String: TTRS No
Value:  0
String: TTRS Yes
Value:  1

Gadget: TTRS OCAM Demo smooth movement
Tip:    TTRS allow observer camera to move smoothly between recorded points during playback
Type:   Toggle
Var:    ocam_bSmoothPlayback

String: TTRS No
Value:  0
String: TTRS Yes
Value:  1

Gadget: TTRS OCAM Demo movement tension
Tip:    TTRS how smooth the camera movement should be during playback (lower value = more precision)
Type:   Toggle
Var:    ocam_fSmoothTension
Slider: Fill

AutoValue: #RANGE# 0 1 0.05

Gadget:
Type:   Separator

Gadget: TTRS OCAM Speed multiplier
Tip:    TTRS observer camera movement speed
Type:   Toggle
Var:    ocam_fSpeed
Slider: Fill

AutoValue: #RANGE# 0.05 0.45 0.05
AutoValue: #RANGE# 0.5 0.9 0.1
AutoValue: #RANGE# 1 10 0.5

Gadget: TTRS OCAM Tilt angle multiplier
Tip:    TTRS how much the observer camera should tilt left and right using the controls
Type:   Toggle
Var:    ocam_fTiltAngleMul
Slider: Fill

AutoValue: #RANGE# 0.1 2 0.1

Gadget: TTRS OCAM FOV
Tip:    TTRS current field of view of the observer camera
Type:   Toggle
Var:    ocam_fFOV
RealTime: Yes
Slider: Fill

AutoValue: #RANGE# 10 170 5

Gadget: TTRS OCAM FOV change multiplier
Tip:    TTRS how fast to change the observer camera FOV using the controls
Type:   Toggle
Var:    ocam_fFOVChangeMul
Slider: Fill

AutoValue: #RANGE# 0.25 2 0.25

Gadget: TTRS OCAM Movement smoothing
Tip:    TTRS how much to multiply the camera speed by to make it move smoother
Type:   Toggle
Var:    ocam_fSmoothMovement
Slider: Fill

AutoValue: #RANGE# 0.05 1 0.05

Gadget: TTRS OCAM Rotation smoothing
Tip:    TTRS how much to multiply the camera speed by to make it rotate smoother
Type:   Toggle
Var:    ocam_fSmoothRotation
Slider: Fill

AutoValue: #RANGE# 0.05 1 0.05

Gadget: TTRS OCAM Focus distance
Tip:    TTRS maximum distance between the observer camera and the current player
Type:   Toggle
Var:    ocam_fFocusDist
Slider: Fill

String: TTRS Unlimited
Value:  -1
AutoValue: #RANGE# 0 32 1

